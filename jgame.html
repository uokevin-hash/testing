<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Minesweeper Deluxe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Pretendard:wght@400;600;700;800&display=swap');

    :root {
      --cell-size: 32px;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .lcd-counter {
      font-family: 'Share Tech Mono', monospace;
      text-shadow: 0 0 6px rgba(239, 68, 68, 0.6);
    }

    /* 3D 레트로 입체 버튼 테두리 스타일 */
    .retro-border-outset {
      border: 3px solid;
      border-color: #ffffff #808080 #808080 #ffffff;
    }

    .retro-border-inset {
      border: 3px solid;
      border-color: #808080 #ffffff #ffffff #808080;
    }

    .tile-cover {
      border-top: 3px solid #ffffff;
      border-left: 3px solid #ffffff;
      border-right: 3px solid #7b7b7b;
      border-bottom: 3px solid #7b7b7b;
      background: #c0c0c0;
    }

    .tile-cover:active, .tile-pressed {
      border: 1px solid #7b7b7b !important;
      background: #bdbdbd !important;
    }

    .tile-revealed {
      border: 1px solid #9e9e9e;
      background: #d4d4d8;
    }

    /* 숫자별 색상 규격 */
    .num-1 { color: #0000ff; }
    .num-2 { color: #008000; }
    .num-3 { color: #ff0000; }
    .num-4 { color: #000080; }
    .num-5 { color: #800000; }
    .num-6 { color: #008080; }
    .num-7 { color: #000000; }
    .num-8 { color: #808080; }

    /* 보드 가로 스크롤바 미려화 */
    .board-container::-webkit-scrollbar {
      height: 8px;
      width: 8px;
    }
    .board-container::-webkit-scrollbar-thumb {
      background: #9ca3af;
      border-radius: 4px;
    }
    .board-container::-webkit-scrollbar-track {
      background: #e5e7eb;
    }

    /* 캔버스 오버레이 (폭죽) */
    #confettiCanvas {
      pointer-events: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 50;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 select-none">
  <canvas id="confettiCanvas"></canvas>

  <!-- 게임 메인 컨테이너 -->
  <div class="w-full max-w-4xl bg-neutral-200 retro-border-outset p-3 sm:p-4 shadow-2xl rounded-sm flex flex-col items-center">
    
    <!-- 네비게이션 헤더 및 난이도 선택 -->
    <div class="w-full flex flex-wrap items-center justify-between gap-2 mb-3 bg-neutral-300 p-2 border border-neutral-400 rounded">
      <div class="flex items-center gap-1 sm:gap-2">
        <span class="font-extrabold text-neutral-800 text-base sm:text-lg flex items-center gap-1.5 mr-1 sm:mr-2">
          <i class="fa-solid fa-bomb text-red-600"></i> 지뢰찾기
        </span>
        <button onclick="setDifficulty('beginner')" id="btn-beginner" class="px-2 py-1 text-xs sm:text-sm font-semibold rounded bg-neutral-200 border border-neutral-400 hover:bg-white active:bg-neutral-300 transition">초급</button>
        <button onclick="setDifficulty('intermediate')" id="btn-intermediate" class="px-2 py-1 text-xs sm:text-sm font-semibold rounded bg-neutral-200 border border-neutral-400 hover:bg-white active:bg-neutral-300 transition">중급</button>
        <button onclick="setDifficulty('expert')" id="btn-expert" class="px-2 py-1 text-xs sm:text-sm font-semibold rounded bg-neutral-200 border border-neutral-400 hover:bg-white active:bg-neutral-300 transition">고급</button>
        <button onclick="openCustomModal()" class="px-2 py-1 text-xs sm:text-sm font-semibold rounded bg-neutral-200 border border-neutral-400 hover:bg-white active:bg-neutral-300 transition">커스텀</button>
      </div>

      <!-- 사운드 및 모바일 모드 버튼 -->
      <div class="flex items-center gap-2">
        <!-- 모바일 전용 깃발 토글 버튼 -->
        <button id="flagModeBtn" onclick="toggleFlagMode()" class="px-2.5 py-1 text-xs sm:text-sm font-bold rounded flex items-center gap-1.5 bg-neutral-100 border border-neutral-400 shadow-sm active:translate-y-0.5">
          <i class="fa-solid fa-flag text-red-600"></i>
          <span id="flagModeText" class="hidden sm:inline">깃발 모드: OFF</span>
        </button>
        <button id="soundBtn" onclick="toggleSound()" class="p-1.5 sm:px-2.5 sm:py-1 text-xs sm:text-sm font-bold rounded bg-neutral-100 border border-neutral-400 shadow-sm">
          <i id="soundIcon" class="fa-solid fa-volume-high text-neutral-700"></i>
        </button>
      </div>
    </div>

    <!-- 클래식 상단 바 (지뢰수, 스마일리, 타이머) -->
    <div class="w-full bg-[#c0c0c0] retro-border-inset p-2 mb-3 flex items-center justify-between">
      <!-- 남은 지뢰 LCD 카운터 -->
      <div class="bg-black text-red-600 px-2 py-1 text-2xl sm:text-3xl font-bold tracking-widest lcd-counter retro-border-inset rounded-xs" id="mineCounter">
        010
      </div>

      <!-- 스마일리 버튼 -->
      <button id="faceBtn" onclick="resetGame()" class="w-10 h-10 sm:w-12 sm:h-12 text-2xl sm:text-3xl flex items-center justify-center retro-border-outset bg-[#c0c0c0] active:border-inset outline-none hover:brightness-105 active:scale-95 transition-transform" title="다시 시작">
        🙂
      </button>

      <!-- 시간 타이머 LCD 카운터 -->
      <div class="bg-black text-red-600 px-2 py-1 text-2xl sm:text-3xl font-bold tracking-widest lcd-counter retro-border-inset rounded-xs" id="timerCounter">
        000
      </div>
    </div>

    <!-- 지뢰 보드 영역 -->
    <div class="w-full overflow-auto max-h-[70vh] flex justify-center retro-border-inset p-1.5 sm:p-2 bg-neutral-400 board-container" id="boardScrollContainer">
      <div id="board" class="grid gap-0 bg-neutral-400" oncontextmenu="return false;"></div>
    </div>

    <!-- 하단 조작 가이드 안내 -->
    <div class="mt-3 w-full text-xs text-neutral-600 flex flex-wrap justify-between items-center px-1">
      <span class="flex items-center gap-2">
        <span>🖱️ <b>좌클릭</b>: 열기</span>
        <span>🚩 <b>우클릭/길게 누르기</b>: 깃발</span>
        <span>⚡ <b>더블클릭</b>: 주변 열기(Chord)</span>
      </span>
      <span id="gameStatusText" class="font-bold text-neutral-800 mt-1 sm:mt-0"></span>
    </div>
  </div>

  <!-- 커스텀 난이도 모달 -->
  <div id="customModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 z-40">
    <div class="bg-neutral-100 rounded-lg p-5 w-80 shadow-2xl border border-neutral-300">
      <h3 class="text-base font-bold text-neutral-800 mb-3 flex items-center gap-2">
        <i class="fa-solid fa-sliders text-blue-600"></i> 사용자 설정 난이도
      </h3>
      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-neutral-600 font-medium mb-1">가로 너비 (9 ~ 32)</label>
          <input type="number" id="customCols" min="9" max="32" value="9" class="w-full px-2.5 py-1.5 border border-neutral-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-neutral-600 font-medium mb-1">세로 높이 (9 ~ 24)</label>
          <input type="number" id="customRows" min="9" max="24" value="9" class="w-full px-2.5 py-1.5 border border-neutral-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-neutral-600 font-medium mb-1">지뢰 개수 (1 ~ 300)</label>
          <input type="number" id="customMines" min="1" max="300" value="10" class="w-full px-2.5 py-1.5 border border-neutral-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-5">
        <button onclick="closeCustomModal()" class="px-3 py-1.5 text-xs font-semibold rounded bg-neutral-200 hover:bg-neutral-300">취소</button>
        <button onclick="applyCustomDifficulty()" class="px-3 py-1.5 text-xs font-bold rounded bg-blue-600 text-white hover:bg-blue-700 shadow">적용하기</button>
      </div>
    </div>
  </div>

  <script>
    // Web Audio API를 활용한 효과음 합성기 (외부 사운드 의존성 제거)
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      if (!soundEnabled) return;
      try {
        initAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(300, now + 0.04);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.04);
          osc.start(now);
          osc.stop(now + 0.04);
        } else if (type === 'flag') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(880, now + 0.05);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (type === 'unflag') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(700, now);
          osc.frequency.setValueAtTime(350, now + 0.05);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (type === 'explode') {
          // 백색 잡음 및 폭발음 합성
          const bufferSize = audioCtx.sampleRate * 0.4;
          const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          const noise = audioCtx.createBufferSource();
          noise.buffer = buffer;
          const filter = audioCtx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(600, now);
          filter.frequency.linearRampToValueAtTime(50, now + 0.4);

          gain.gain.setValueAtTime(0.8, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

          noise.connect(filter);
          filter.connect(gain);
          noise.start(now);
        } else if (type === 'win') {
          // 승리 팡파레
          const notes = [523.25, 659.25, 783.99, 1046.50]; // C E G C
          notes.forEach((freq, i) => {
            const toneOsc = audioCtx.createOscillator();
            const toneGain = audioCtx.createGain();
            toneOsc.connect(toneGain);
            toneGain.connect(audioCtx.destination);
            toneOsc.type = 'triangle';
            toneOsc.frequency.setValueAtTime(freq, now + i * 0.1);
            toneGain.gain.setValueAtTime(0.25, now + i * 0.1);
            toneGain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.25);
            toneOsc.start(now + i * 0.1);
            toneOsc.stop(now + i * 0.1 + 0.25);
          });
        }
      } catch (e) {
        console.warn('Audio playback error:', e);
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const icon = document.getElementById('soundIcon');
      if (soundEnabled) {
        icon.className = 'fa-solid fa-volume-high text-neutral-700';
      } else {
        icon.className = 'fa-solid fa-volume-xmark text-red-500';
      }
    }

    // 난이도 프리셋
    const DIFFICULTIES = {
      beginner: { rows: 9, cols: 9, mines: 10 },
      intermediate: { rows: 16, cols: 16, mines: 40 },
      expert: { rows: 16, cols: 30, mines: 99 }
    };

    let currentConfig = { ...DIFFICULTIES.beginner };
    let board = [];
    let gameStatus = 'ready'; // 'ready', 'playing', 'won', 'lost'
    let timer = 0;
    let timerInterval = null;
    let flagsCount = 0;
    let isFlagMode = false; // 모바일 친화적 깃발 모드
    let touchTimer = null;
    let isTouchMoved = false;

    // 표정 이모지 상수
    const FACES = {
      default: '🙂',
      pressed: '😮',
      win: '😎',
      lose: '😵'
    };

    function setFace(face) {
      document.getElementById('faceBtn').textContent = face;
    }

    function updateCounters() {
      const remainingMines = Math.max(-99, Math.min(999, currentConfig.mines - flagsCount));
      const formattedMines = remainingMines < 0 
        ? '-' + String(Math.abs(remainingMines)).padStart(2, '0')
        : String(remainingMines).padStart(3, '0');
      document.getElementById('mineCounter').textContent = formattedMines;

      const formattedTimer = String(Math.min(999, timer)).padStart(3, '0');
      document.getElementById('timerCounter').textContent = formattedTimer;
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      timer = 0;
      updateCounters();
    }

    function startTimer() {
      if (timerInterval) return;
      timer = 1;
      updateCounters();
      timerInterval = setInterval(() => {
        timer++;
        if (timer > 999) timer = 999;
        updateCounters();
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function initBoardData() {
      board = [];
      for (let r = 0; r < currentConfig.rows; r++) {
        const row = [];
        for (let c = 0; c < currentConfig.cols; c++) {
          row.push({
            r,
            c,
            isMine: false,
            isRevealed: false,
            isFlagged: false,
            isQuestion: false,
            neighborMines: 0,
            isExplodedMine: false,
            isWrongFlag: false
          });
        }
        board.push(row);
      }
    }

    function renderBoard() {
      const boardElement = document.getElementById('board');
      boardElement.innerHTML = '';
      boardElement.style.gridTemplateColumns = `repeat(${currentConfig.cols}, minmax(0, 1fr))`;

      // 타일 크기 반응형 조절
      let cellSizeClass = 'w-7 h-7 sm:w-8 sm:h-8 text-sm sm:text-base';
      if (currentConfig.cols > 20) {
        cellSizeClass = 'w-6 h-6 sm:w-7 sm:h-7 text-xs sm:text-sm';
      }

      for (let r = 0; r < currentConfig.rows; r++) {
        for (let c = 0; c < currentConfig.cols; c++) {
          const cell = board[r][c];
          const cellEl = document.createElement('div');
          cellEl.id = `cell-${r}-${c}`;
          cellEl.className = `${cellSizeClass} flex items-center justify-center font-extrabold cursor-pointer select-none transition-colors duration-75 ${
            cell.isRevealed ? 'tile-revealed' : 'tile-cover hover:brightness-105'
          }`;

          renderCellContent(cellEl, cell);

          // 마우스 상호작용
          cellEl.addEventListener('mousedown', (e) => handleMouseDown(e, r, c));
          cellEl.addEventListener('mouseup', (e) => handleMouseUp(e, r, c));
          cellEl.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            toggleFlag(r, c);
          });
          cellEl.addEventListener('dblclick', () => handleChord(r, c));

          // 모바일 터치 상호작용 (롱프레스 지원)
          cellEl.addEventListener('touchstart', (e) => handleTouchStart(e, r, c), { passive: false });
          cellEl.addEventListener('touchmove', () => { isTouchMoved = true; });
          cellEl.addEventListener('touchend', (e) => handleTouchEnd(e, r, c));

          boardElement.appendChild(cellEl);
        }
      }
    }

    function renderCellContent(cellEl, cell) {
      cellEl.innerHTML = '';
      cellEl.className = cellEl.className.replace(/num-\d|bg-red-500|bg-red-200/g, '').trim();

      if (cell.isRevealed) {
        cellEl.classList.remove('tile-cover');
        cellEl.classList.add('tile-revealed');

        if (cell.isMine) {
          if (cell.isExplodedMine) {
            cellEl.classList.add('bg-red-500');
          }
          cellEl.innerHTML = '<i class="fa-solid fa-bomb text-black text-xs sm:text-sm"></i>';
        } else if (cell.neighborMines > 0) {
          cellEl.classList.add(`num-${cell.neighborMines}`);
          cellEl.textContent = cell.neighborMines;
        }
      } else {
        cellEl.classList.remove('tile-revealed');
        cellEl.classList.add('tile-cover');

        if (cell.isWrongFlag) {
          cellEl.innerHTML = '<span class="relative flex items-center justify-center"><i class="fa-solid fa-bomb text-neutral-800 text-xs"></i><i class="fa-solid fa-xmark text-red-600 text-lg absolute"></i></span>';
        } else if (cell.isFlagged) {
          cellEl.innerHTML = '<i class="fa-solid fa-flag text-red-600 text-xs sm:text-sm drop-shadow-xs"></i>';
        } else if (cell.isQuestion) {
          cellEl.innerHTML = '<span class="text-neutral-800 font-bold text-xs sm:text-sm">?</span>';
        }
      }
    }

    // 첫 클릭 시 해당 위치 및 인접 8개 영역에 지뢰가 생기지 않도록 방지
    function placeMines(firstR, firstC) {
      const safePositions = new Set();
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const nr = firstR + dr;
          const nc = firstC + dc;
          if (nr >= 0 && nr < currentConfig.rows && nc >= 0 && nc < currentConfig.cols) {
            safePositions.add(`${nr},${nc}`);
          }
        }
      }

      let minesPlaced = 0;
      const totalCells = currentConfig.rows * currentConfig.cols;
      const targetMines = Math.min(currentConfig.mines, totalCells - safePositions.size);

      while (minesPlaced < targetMines) {
        const randR = Math.floor(Math.random() * currentConfig.rows);
        const randC = Math.floor(Math.random() * currentConfig.cols);
        const key = `${randR},${randC}`;

        if (!safePositions.has(key) && !board[randR][randC].isMine) {
          board[randR][randC].isMine = true;
          minesPlaced++;
        }
      }

      // 인접 지뢰 수 계산
      for (let r = 0; r < currentConfig.rows; r++) {
        for (let c = 0; c < currentConfig.cols; c++) {
          if (!board[r][c].isMine) {
            board[r][c].neighborMines = countNeighborMines(r, c);
          }
        }
      }
    }

    function countNeighborMines(r, c) {
      let count = 0;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const nr = r + dr;
          const nc = c + dc;
          if (nr >= 0 && nr < currentConfig.rows && nc >= 0 && nc < currentConfig.cols) {
            if (board[nr][nc].isMine) count++;
          }
        }
      }
      return count;
    }

    function revealCell(r, c) {
      if (gameStatus === 'won' || gameStatus === 'lost') return;
      const cell = board[r][c];
      if (cell.isRevealed || cell.isFlagged) return;

      if (gameStatus === 'ready') {
        placeMines(r, c);
        gameStatus = 'playing';
        startTimer();
      }

      if (cell.isMine) {
        cell.isExplodedMine = true;
        gameOver(false);
        return;
      }

      playSound('click');
      cell.isRevealed = true;

      // 0인 경우 Flood Fill 자동 확장
      if (cell.neighborMines === 0) {
        floodFill(r, c);
      }

      refreshAllCells();
      checkWinCondition();
    }

    function floodFill(startR, startC) {
      const queue = [[startR, startC]];
      const visited = new Set([`${startR},${startC}`]);

      while (queue.length > 0) {
        const [cr, cc] = queue.shift();

        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = cr + dr;
            const nc = cc + dc;
            if (nr >= 0 && nr < currentConfig.rows && nc >= 0 && nc < currentConfig.cols) {
              const neighbor = board[nr][nc];
              const key = `${nr},${nc}`;
              if (!neighbor.isRevealed && !neighbor.isFlagged && !visited.has(key)) {
                neighbor.isRevealed = true;
                visited.add(key);
                if (neighbor.neighborMines === 0) {
                  queue.push([nr, nc]);
                }
              }
            }
          }
        }
      }
    }

    function toggleFlag(r, c) {
      if (gameStatus === 'won' || gameStatus === 'lost') return;
      const cell = board[r][c];
      if (cell.isRevealed) return;

      if (!cell.isFlagged && !cell.isQuestion) {
        cell.isFlagged = true;
        flagsCount++;
        playSound('flag');
      } else if (cell.isFlagged) {
        cell.isFlagged = false;
        cell.isQuestion = true;
        flagsCount--;
        playSound('unflag');
      } else if (cell.isQuestion) {
        cell.isQuestion = false;
        playSound('click');
      }

      updateCounters();
      const cellEl = document.getElementById(`cell-${r}-${c}`);
      renderCellContent(cellEl, cell);
    }

    // Chord 기능: 이미 열린 숫자 타일 주변에 깃발 수가 일치할 경우 인접 미개방 타일 동시 개방
    function handleChord(r, c) {
      const cell = board[r][c];
      if (!cell.isRevealed || cell.neighborMines === 0) return;

      let flagCount = 0;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const nr = r + dr;
          const nc = c + dc;
          if (nr >= 0 && nr < currentConfig.rows && nc >= 0 && nc < currentConfig.cols) {
            if (board[nr][nc].isFlagged) flagCount++;
          }
        }
      }

      if (flagCount === cell.neighborMines) {
        let hitMine = false;
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr;
            const nc = c + dc;
            if (nr >= 0 && nr < currentConfig.rows && nc >= 0 && nc < currentConfig.cols) {
              const target = board[nr][nc];
              if (!target.isRevealed && !target.isFlagged) {
                target.isRevealed = true;
                if (target.isMine) {
                  target.isExplodedMine = true;
                  hitMine = true;
                } else if (target.neighborMines === 0) {
                  floodFill(nr, nc);
                }
              }
            }
          }
        }
        if (hitMine) {
          gameOver(false);
        } else {
          playSound('click');
          refreshAllCells();
          checkWinCondition();
        }
      }
    }

    function handleMouseDown(e, r, c) {
      if (gameStatus === 'won' || gameStatus === 'lost') return;
      if (e.button === 0) {
        setFace(FACES.pressed);
      }
    }

    function handleMouseUp(e, r, c) {
      if (gameStatus === 'won' || gameStatus === 'lost') return;
      setFace(FACES.default);
      if (e.button === 0) {
        if (isFlagMode) {
          toggleFlag(r, c);
        } else {
          revealCell(r, c);
        }
      }
    }

    function handleTouchStart(e, r, c) {
      isTouchMoved = false;
      touchTimer = setTimeout(() => {
        if (!isTouchMoved) {
          toggleFlag(r, c);
          if (navigator.vibrate) navigator.vibrate(40);
        }
      }, 400); // 400ms 롱프레스 시 깃발
    }

    function handleTouchEnd(e, r, c) {
      clearTimeout(touchTimer);
      if (isTouchMoved) return;
      e.preventDefault();
      if (isFlagMode) {
        toggleFlag(r, c);
      } else {
        revealCell(r, c);
      }
    }

    function toggleFlagMode() {
      isFlagMode = !isFlagMode;
      const btn = document.getElementById('flagModeBtn');
      const text = document.getElementById('flagModeText');
      if (isFlagMode) {
        btn.classList.add('bg-red-500', 'text-white', 'border-red-700');
        btn.classList.remove('bg-neutral-100');
        text.textContent = '깃발 모드: ON';
      } else {
        btn.classList.remove('bg-red-500', 'text-white', 'border-red-700');
        btn.classList.add('bg-neutral-100');
        text.textContent = '깃발 모드: OFF';
      }
    }

    function refreshAllCells() {
      for (let r = 0; r < currentConfig.rows; r++) {
        for (let c = 0; c < currentConfig.cols; c++) {
          const cellEl = document.getElementById(`cell-${r}-${c}`);
          if (cellEl) renderCellContent(cellEl, board[r][c]);
        }
      }
    }

    function checkWinCondition() {
      let unrevealedSafeCells = 0;
      for (let r = 0; r < currentConfig.rows; r++) {
        for (let c = 0; c < currentConfig.cols; c++) {
          const cell = board[r][c];
          if (!cell.isMine && !cell.isRevealed) {
            unrevealedSafeCells++;
          }
        }
      }

      if (unrevealedSafeCells === 0) {
        gameOver(true);
      }
    }

    function gameOver(isWin) {
      stopTimer();
      gameStatus = isWin ? 'won' : 'lost';
      setFace(isWin ? FACES.win : FACES.lose);
      const statusText = document.getElementById('gameStatusText');

      if (isWin) {
        playSound('win');
        statusText.textContent = `🎉 승리했습니다! 기록: ${timer}초`;
        statusText.className = 'font-bold text-emerald-600 mt-1 sm:mt-0';
        // 남은 지뢰에 모두 깃발 꽂아주기
        for (let r = 0; r < currentConfig.rows; r++) {
          for (let c = 0; c < currentConfig.cols; c++) {
            if (board[r][c].isMine) {
              board[r][c].isFlagged = true;
            }
          }
        }
        flagsCount = currentConfig.mines;
        updateCounters();
        triggerConfetti();
      } else {
        playSound('explode');
        statusText.textContent = '💥 지뢰를 밟았습니다! 다시 도전해보세요.';
        statusText.className = 'font-bold text-red-600 mt-1 sm:mt-0';
        // 모든 지뢰 공개 및 오답 깃발 표시
        for (let r = 0; r < currentConfig.rows; r++) {
          for (let c = 0; c < currentConfig.cols; c++) {
            const cell = board[r][c];
            if (cell.isMine && !cell.isFlagged) {
              cell.isRevealed = true;
            } else if (!cell.isMine && cell.isFlagged) {
              cell.isWrongFlag = true;
            }
          }
        }
      }
      refreshAllCells();
    }

    function triggerConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6'];

      for (let i = 0; i < 120; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.7) * 16,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 10,
          alpha: 1
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let activeParticles = 0;

        particles.forEach(p => {
          if (p.alpha > 0) {
            activeParticles++;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.35; // 중력
            p.rotation += p.rotationSpeed;
            p.alpha -= 0.008;

            ctx.save();
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            ctx.restore();
          }
        });

        if (activeParticles > 0) {
          requestAnimationFrame(animate);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      animate();
    }

    function updateDifficultyButtons(activeKey) {
      ['beginner', 'intermediate', 'expert'].forEach(key => {
        const btn = document.getElementById(`btn-${key}`);
        if (key === activeKey) {
          btn.className = 'px-2 py-1 text-xs sm:text-sm font-bold rounded bg-blue-600 text-white border border-blue-700 shadow-inner';
        } else {
          btn.className = 'px-2 py-1 text-xs sm:text-sm font-semibold rounded bg-neutral-200 border border-neutral-400 hover:bg-white active:bg-neutral-300 transition';
        }
      });
    }

    function setDifficulty(level) {
      if (DIFFICULTIES[level]) {
        currentConfig = { ...DIFFICULTIES[level] };
        updateDifficultyButtons(level);
        resetGame();
      }
    }

    function openCustomModal() {
      document.getElementById('customCols').value = currentConfig.cols;
      document.getElementById('customRows').value = currentConfig.rows;
      document.getElementById('customMines').value = currentConfig.mines;
      document.getElementById('customModal').classList.remove('hidden');
    }

    function closeCustomModal() {
      document.getElementById('customModal').classList.add('hidden');
    }

    function applyCustomDifficulty() {
      let cols = parseInt(document.getElementById('customCols').value, 10);
      let rows = parseInt(document.getElementById('customRows').value, 10);
      let mines = parseInt(document.getElementById('customMines').value, 10);

      cols = Math.max(9, Math.min(32, isNaN(cols) ? 9 : cols));
      rows = Math.max(9, Math.min(24, isNaN(rows) ? 9 : rows));
      const maxMines = Math.floor(cols * rows * 0.85);
      mines = Math.max(1, Math.min(maxMines, isNaN(mines) ? 10 : mines));

      currentConfig = { cols, rows, mines };
      updateDifficultyButtons(null);
      closeCustomModal();
      resetGame();
    }

    function resetGame() {
      gameStatus = 'ready';
      flagsCount = 0;
      resetTimer();
      setFace(FACES.default);
      document.getElementById('gameStatusText').textContent = '';
      initBoardData();
      renderBoard();
      updateCounters();
    }

    // 창 크기 변경 시 폭죽 캔버스 크기 재조정
    window.addEventListener('resize', () => {
      const canvas = document.getElementById('confettiCanvas');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    // 초기 시작
    window.onload = () => {
      setDifficulty('beginner');
    };
  </script>
</body>
